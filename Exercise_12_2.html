<!DOCTYPE html>
<html>

<head>
    <title>Pricing Section</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <div class="row g-4">

            <div class="col-md-4">

                <div class="card p-4 text-center">

                    <h3>Basic</h3>
                    <h2>$9</h2>

                    <p>1 User</p>
                    <p>5 GB Storage</p>

                    <button class="btn btn-primary">
                        Choose Plan
                    </button>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card p-4 text-center">

                    <h3>Pro</h3>
                    <h2>$29</h2>

                    <p>10 Users</p>
                    <p>50 GB Storage</p>

                    <button class="btn btn-success">
                        Choose Plan
                    </button>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card p-4 text-center">

                    <h3>Enterprise</h3>
                    <h2>$99</h2>

                    <p>Unlimited Users</p>
                    <p>500 GB Storage</p>

                    <button class="btn btn-danger">
                        Choose Plan
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
